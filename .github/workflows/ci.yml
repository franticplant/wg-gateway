name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Third-party notices are up to date
        run: python3 scripts/gen-notices.py && git diff --exit-code THIRD_PARTY_NOTICES.txt
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: scratch }
          - { target: alpine }
          # The bare UBI root has no Red Hat content-set metadata, so Trivy
          # cannot match its two data-only RPMs to advisories. Scan the Go
          # binary's modules; the RPMs contain no code.
          - { target: ubi, vuln-type: library }
          - { target: ubi-micro }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          pull: true
          tags: wg-gateway:${{ matrix.target }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wg-gateway:${{ matrix.target }}
          severity: CRITICAL,HIGH
          vuln-type: ${{ matrix.vuln-type || 'os,library' }}
          ignore-unfixed: true
          exit-code: "1"
