name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [scratch, alpine, ubi, ubi-minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          pull: true
          tags: wg-gateway:${{ matrix.target }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wg-gateway:${{ matrix.target }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
