name: Weekly rebuild

# Base images (Alpine, UBI) are patched under the same tag. Rebuild the
# rolling tags of the latest release so they pick those fixes up.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  latest-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: latest-release
    if: needs.latest-release.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: scratch,     rolling: latest }
          - { target: alpine,      rolling: alpine }
          - { target: ubi,   rolling: ubi }
          - { target: ubi-minimal, rolling: ubi-minimal }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.latest-release.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE }}:${{ matrix.rolling }}
          build-args: VERSION=${{ needs.latest-release.outputs.tag }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
